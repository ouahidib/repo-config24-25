services:
  discovery-ms:
    build: ./discovery-ms
    container_name: dock-discovery
    ports:
      - "8761:8761"
    expose:
      - "8761"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  config-ms:
    build: ./config-ms
    container_name: dock-config
    ports:
      - "9999:9999"
    environment:
      EUREKA_URL: http://dock-discovery:8761/eureka/
    depends_on:
      discovery-ms:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9999/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  client-ms:
    build: ./client-ms
    environment:
      EUREKA_URL: http://dock-discovery-ms:8761/eureka/
      CONFIG_URL: http://dock-config:9999
    depends_on:
      config-ms:
        condition: service_healthy
  produit-ms:
    build: ./produit-service
    environment:
      EUREKA_URL: http://discovery-ms:8761/eureka/
      CONFIG_URL: http://dock-config:9999
    depends_on:
      config-ms:
        condition: service_healthy
  commande-ms:
    build: ./commande-sevice
    environment:
      EUREKA_URL: http://discovery-ms:8761/eureka/
      CONFIG_URL: http://dock-config:9999
    depends_on:
      config-ms:
        condition: service_healthy
      client-ms:
        condition: service_healthy
      produit-ms:
        condition: service_healthy
  gateway-ms:
    build: ./gateway-service
    environment:
      EUREKA_URL: http://discovery-ms:8761/eureka/
      CONFIG_URL: http://dock-config:9999
    depends_on:
      commande-ms:
        condition: service_healthy



